<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusBot</title>
<style>
  :root {
    --bg: #eef1f6;
    --ink: #1b2b4b;
    --ink-soft: #5a6785;
    --surface: #ffffff;
    --line: #d6dce8;
    --accent: #e0a526;
    --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  header {
    padding: 16px 20px;
    background: var(--ink);
    color: #fff;
  }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 0.85rem; color: #b9c3da; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--bg);
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 0.97rem;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--ink);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .msg.error { border-color: #c0392b; color: #8e2a1f; }
  .sources {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--line);
    font-size: 0.8rem;
    color: var(--ink-soft);
  }

  .fb { margin-top: 8px; display: flex; gap: 6px; }
  .fb button {
    font: inherit; font-size: 0.8rem; padding: 3px 10px;
    border: 1px solid var(--line); background: var(--surface);
    color: var(--ink-soft); border-radius: 999px; cursor: pointer;
  }
  .fb button:hover { border-color: var(--ink); color: var(--ink); }
  .fb .done { font-size: 0.8rem; color: var(--ink-soft); }
  .empty { margin: auto; text-align: center; color: var(--ink-soft); max-width: 420px; }
  .empty h2 { margin: 0 0 6px; font-size: 1.1rem; color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .chip {
    font: inherit; font-size: 0.88rem;
    padding: 8px 12px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 999px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--ink); }

  .typing span {
    display: inline-block; width: 6px; height: 6px; margin-right: 3px;
    border-radius: 50%; background: var(--ink-soft);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  form {
    display: flex; gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  input[type="text"] {
    flex: 1;
    font: inherit;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
  }
  button.send {
    font: inherit; font-weight: 600;
    padding: 0 18px;
    border: 0; border-radius: 10px;
    background: var(--ink); color: #fff;
    cursor: pointer;
  }
  button.send:disabled { opacity: .5; cursor: not-allowed; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .6; } }
  @media (max-width: 520px) { .msg { max-width: 92%; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>CampusBot</h1>
    <p>Ask about admissions, fees, timetables, and hostels.</p>
  </header>

  <div id="messages" aria-live="polite">
    <div class="empty" id="empty">
      <h2>What do you want to know?</h2>
      <p>Answers come from your college's official documents.</p>
      <div class="chips">
        <button class="chip" type="button">What are the hostel fees?</button>
        <button class="chip" type="button">How do I apply for admission?</button>
        <button class="chip" type="button">When do exams start?</button>
      </div>
    </div>
  </div>

  <form id="form">
    <input type="text" id="input" placeholder="Type your question" autocomplete="off" aria-label="Your question">
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  // One id per browser so the server can keep chat history
  let sessionId = null;
  try { sessionId = localStorage.getItem("campusbot_session"); } catch (e) {}
  if (!sessionId) {
    sessionId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random();
    try { localStorage.setItem("campusbot_session", sessionId); } catch (e) {}
  }

  function addMessage(text, role, sources, isError, question) {
    const empty = document.getElementById("empty");
    if (empty) empty.remove();

    const div = document.createElement("div");
    div.className = "msg " + role + (isError ? " error" : "");
    div.textContent = text;

    if (sources && sources.length) {
      const s = document.createElement("div");
      s.className = "sources";
      s.textContent = "Sources: " + sources.join(", ");
      div.appendChild(s);
    }
    if (role === "bot" && !isError && question) {
      const fb = document.createElement("div");
      fb.className = "fb";
      const send = (rating) => {
        fetch("/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, question, answer: text, rating })
        }).catch(() => {});
        fb.innerHTML = '<span class="done">Thanks for the feedback.</span>';
      };
      const up = document.createElement("button");
      up.type = "button"; up.textContent = "Helpful"; up.onclick = () => send(1);
      const down = document.createElement("button");
      down.type = "button"; down.textContent = "Not helpful"; down.onclick = () => send(-1);
      fb.append(up, down);
      div.appendChild(fb);
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "msg bot typing";
    div.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function ask(question) {
    addMessage(question, "user");
    sendBtn.disabled = true;
    const typing = addTyping();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: question })
      });
      if (!res.ok) throw new Error("Server returned " + res.status);
      const data = await res.json();
      typing.remove();
      addMessage(data.answer, "bot", data.sources, false, question);
    } catch (err) {
      typing.remove();
      addMessage("Couldn't get an answer. Check that the server is running and try again.", "bot", null, true);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    input.value = "";
    ask(q);
  });

  document.querySelectorAll(".chip").forEach((chip) =>
    chip.addEventListener("click", () => ask(chip.textContent))
  );
</script>
</body>
</html>
